
# =========================
# APP CONFIG
# =========================
spring.application.name=financewave-loan-service
server.port=8085

# =========================
# LOAD ENV
# =========================
spring.config.import=optional:file:.env

# =========================
# DATABASE CONFIG
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/financewave_loan_db
spring.datasource.username=postgres
spring.datasource.password=admin
#spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
#spring.datasource.username=${DB_USER}
#spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# JWT CONFIG (optional for now)
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# =========================
# MICROSERVICE URLs (FUTURE USE)
# =========================
account.service.url=http://localhost:8082
transaction.service.url=http://localhost:8083

# =========================
# LOAN FEATURES
# =========================
feature.loan.eligibility=true
feature.loan.approval=true
feature.loan.disbursement=true
feature.loan.documents=true

# =========================
# LOGGING (optional but useful)
# =========================
logging.level.org.springframework=INFO
logging.level.com.financewave=DEBUG

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect